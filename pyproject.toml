[project]
name = "quanttrader"
version = "0.4.0"
description = "QuantTrader Phase 4 — systematic futures trading (IBKR paper first). See BUILD_PLAN.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # ruff-specific
    "PL",  # pylint (subset)
    "N",   # pep8-naming
]
[tool.ruff.lint.per-file-ignores]
# Magic values are fine in tests/fixtures; on the money path (src/) they must be named.
"tests/*" = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "."]
files = ["src/qt", "scripts", "tests"]
explicit_package_bases = true
namespace_packages = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
